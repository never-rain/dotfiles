source = $HOME/.config/hypr/mocha.conf

# GENERAL
general {
  hide_cursor = true
  ignore_empty_input = true
  immediate_render = false
}

animations {
  enabled = true
  bezier = easeInOut, 0.42, 0, 0.58, 1
  animation = fadeIn, 1, 20, easeInOut
}

# BACKGROUND
background {
  monitor =
  color = $base
  path = ~/.config/wallpapers/16.png
  reload_cmd = find -L "$HOME/.config/wallpapers" -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -print0 | shuf -z -n 1 | tr -d '\0'
  blur_size = 2
  blur_passes = 5
  noise = 0.05
  reload_time = 30
}

# NAME
label {
  monitor =
  text = Signals Intelligence (SIGINT)
  color = $text
  outline_thickness = 0
  font_size = 16
  font_family = Geist
  position = 0, -40
  halign = center
  valign = top
}

# Time
label {
  monitor =
  text = cmd[update:100] echo "$(date +'%H:%M')"
  color = $text
  font_size = 400
  color = rgba(205, 214, 244, .33)
  font_family = Geist Thin
  position = 0, 0
  halign = center
  valign = center
}

# Day-Month-Date
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %d. %B %Y")"
  color = $text
  font_size = 16
  font_family = Geist
  position = 0,40
  halign = center
  valign = bottom
}

# INPUT FIELD
input-field {
  monitor =
  rounding = -1
  size = 250, 50
  outline_thickness = 1
  fade_on_empty = true
  font_family = Geist
  placeholder_text = ENTER PASSKEY

  inner_color = rgba(30, 30, 46, 0.5)
  font_color = $text
  outer_color = rgba(30, 30, 46, 0.5)
  font_color = $text
  capslock_color = $yellow
  numlock_color = $yellow
  bothlock_color = $yellow
  check_color = $green

  check_text = CHECKING PASSKEY
  fail_color = $red
  fail_text = AUTH FAILED
  position = 0, -275
  halign = center
  valign = center
}
